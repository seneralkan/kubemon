name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go vet -tags e2e ./e2e/...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARGO_ROLLOUTS_VERSION: v1.10.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          cluster_name: kubemon
          wait: 120s
      - name: Export kubeconfig
        run: |
          kind get kubeconfig --name kubemon > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Install Argo Rollouts ${{ env.ARGO_ROLLOUTS_VERSION }}
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply -n argo-rollouts -f "https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/install.yaml"
          kubectl wait --for=condition=Established crd/rollouts.argoproj.io --timeout=60s
          kubectl -n argo-rollouts wait --for=condition=Available deployment --all --timeout=180s
      - name: Build kubemon
        run: go build -o bin/kubemon .
      - name: E2E tests
        env:
          KUBEMON_BIN: ${{ github.workspace }}/bin/kubemon
          KUBEMON_E2E_REQUIRE_ARGO: "1"
        run: go test -tags e2e -v -timeout 20m ./e2e/...
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n argo-rollouts logs deploy/argo-rollouts --tail=200
