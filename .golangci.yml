version: "2"
linters:
  enable:
    - errorlint
    - misspell
    - unconvert
    - gocritic
  settings:
    errcheck:
      # Writes to the terminal: nothing useful to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
    - goimports
